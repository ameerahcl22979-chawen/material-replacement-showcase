<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材质替换 · 效果展示</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="showcase.css"></head><body>
<header><h1>材质替换 · 效果展示</h1></header>
<main><nav aria-label="样本导航"><div class="filters"><div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="搜索场景或材质" aria-label="搜索样本"></div><div class="category-picker"><button id="categoryButton" aria-haspopup="listbox" aria-expanded="false" aria-controls="categoryMenu"><span id="categoryLabel">全部家具</span><span class="category-end"><span id="categoryCount">150</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg></span></button><div id="categoryMenu" role="listbox" aria-label="家具分类" hidden></div></div></div><div class="list-count" id="listCount">150个样本</div><div id="list"></div></nav>
<article><div class="heading"><h2 id="title">正在载入</h2><small class="right" id="position"></small></div>
<div class="viewer" id="viewer"><div class="plane" id="plane"><img class="image" id="before" draggable="false" alt="带位置标签的场景"></div><div id="afterClip"><div class="plane" id="afterPlane"><img class="image" id="after" draggable="false" alt="材质替换效果"></div></div><div class="divider" id="divider"><span>‹ ›</span></div><div class="image-labels" id="imageLabels"><span id="leftLabel">标注场景</span><span id="rightLabel">当前效果</span></div><div class="viewer-error" id="viewerError"></div></div>
<div class="tools"><button id="compareButton" aria-pressed="true">滑动对比</button><button id="resultButton" aria-pressed="false">只看效果</button><input id="split" type="range" min="0" max="100" step="any" value="50" aria-label="对比分隔位置"><span class="grow"></span><button id="zoomOut" aria-label="缩小">−</button><span id="zoom">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="resetButton">复位</button><button id="prevButton" aria-label="上一组">‹</button><button id="nextButton" aria-label="下一组">›</button></div></article>
<aside><section class="material-section"><h3>参考材质</h3><div class="material-wrap"><img id="material" alt="点击放大参考材质"><span class="zoom-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M10 6.5v7M6.5 10h7"/></svg></span></div><div class="description" id="materialInfo"></div></section>
<section class="evaluation"><h3>AI评估</h3><dl id="aiMetrics"></dl><p id="aiNote"></p><div class="grade-row"><span>评估档位</span><strong id="humanGrade"></strong></div><p id="humanNote"></p></section></aside></main>
<div class="overlay" id="full" role="dialog" aria-modal="true" aria-label="图片放大预览" hidden><button id="closeFull">关闭</button><img id="fullImage" alt="放大图片"><p id="fullCaption"></p></div><script src="data.js?v=20261023-review2"></script><script src="display.js?v=20261023-review2"></script></body></html>
